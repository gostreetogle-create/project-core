name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: cd backend && npm ci
      - run: npx ng lint
      - run: npx ng build
      - run: npx vitest run
      - run: cd backend && npx tsc --noEmit
      - run: cd backend && npx vitest run --config vitest.config.ts
