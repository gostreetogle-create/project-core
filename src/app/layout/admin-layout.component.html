<kp-toast />

<!-- Mobile sidebar overlay -->
<p-drawer [(visible)]="mobileSidebarVisible" position="left" [style]="{ width: '260px' }" [closable]="true">
  <ng-template pTemplate="header">
    <div class="sidebar-mobile-header">
      <span class="sidebar-logo-text">Project Core</span>
    </div>
  </ng-template>
  <div class="sidebar-mobile-nav">
    @for (item of navItems; track item.label) {
      <a
        [routerLink]="item.routerLink"
        routerLinkActive="p-menuitem-link-active"
        class="sidebar-mobile-item"
        (click)="mobileSidebarVisible.set(false)"
      >
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </div>
</p-drawer>

<div class="layout" [class.layout--collapsed]="!sidebarVisible()">
  <!-- Desktop sidebar -->
  <aside class="layout__sidebar" [class.sidebar--hidden]="!sidebarVisible()">
    <div class="sidebar__header">
      @if (sidebarVisible()) { <span class="sidebar__logo">Project Core</span> }
      <button
        pButton
        class="p-button-text p-button-sm sidebar__toggle"          [icon]="sidebarVisible() ? 'pi pi-angle-left' : 'pi pi-angle-right'"
        (click)="toggleSidebar()"
      ></button>
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.routerLink"
          routerLinkActive="nav__item--active"
          class="nav__item"
          [pTooltip]="!sidebarVisible() ? item.label : ''"
          tooltipPosition="right"
        >
          <i [class]="item.icon + ' nav__icon'"></i>
          @if (sidebarVisible()) { <span class="nav__label">{{ item.label }}</span> }
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <button
        pButton
        class="p-button-text p-button-sm sidebar__theme-btn"
        [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        (click)="toggleTheme()"
        [pTooltip]="isDark() ? 'Светлая тема' : 'Тёмная тема'"
        tooltipPosition="right"
      ></button>
    </div>
  </aside>

  <!-- Main content area -->
  <div class="layout__main-area">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar__left">
        <button
          pButton
          class="p-button-text p-button-sm topbar__mobile-menu"
          icon="pi pi-bars"
          (click)="toggleMobileSidebar()"
        ></button>
      </div>

      <div class="topbar__right">
        <button
          pButton
          class="p-button-text p-button-sm"
          icon="pi pi-bell"
          (click)="onNotificationsClick()"
        ></button>

        <p-tieredMenu
          #userMenu
          [model]="userMenuItems"
          [popup]="true"
          appendTo="body"
        />
        <div class="topbar__user" (click)="userMenu.toggle($event)">
          <p-avatar
            [label]="(currentUser()?.displayName || 'U').charAt(0)"
            styleClass="p-avatar-sm"
            shape="circle"
          />
          @if (sidebarVisible()) { <span class="topbar__username">
            {{ currentUser()?.displayName || 'Пользователь' }}
          </span> }
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="layout__main">
      <router-outlet />
    </main>
  </div>
</div>
